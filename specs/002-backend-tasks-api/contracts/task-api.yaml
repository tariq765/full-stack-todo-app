openapi: 3.0.3
info:
  title: Todo Backend API
  description: RESTful API for managing user-scoped Todo tasks with authentication and authorization
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/{user_id}/tasks:
    get:
      summary: List user's tasks
      description: Return all tasks owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully retrieved user's tasks
          content:
            application/json:
              schema:
                type: object
                required:
                  - tasks
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new task
      description: Create a new task and assign ownership to authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/{user_id}/tasks/{id}:
    get:
      summary: Get task details
      description: Return a specific task only if it belongs to the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully retrieved the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - invalid token or user ID mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found (doesn't exist or belongs to another user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a task
      description: Update title and/or description of a task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - invalid token or user ID mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found (doesn't exist or belongs to another user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a task
      description: Delete a task if owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task deleted successfully"
        '401':
          description: Unauthorized - invalid token or user ID mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found (doesn't exist or belongs to another user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/{user_id}/tasks/{id}/complete:
    patch:
      summary: Toggle task completion
      description: Toggle the completion status of a task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token (must match authenticated user)
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Task completion toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - invalid token or user ID mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found (doesn't exist or belongs to another user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
        - user_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique task identifier
        title:
          type: string
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 1000
          description: Task description (optional)
        completed:
          type: boolean
          description: Whether the task is completed
        user_id:
          type: string
          description: Owner's user ID
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 1000
          description: Task description (optional)
        completed:
          type: boolean
          default: false
          description: Initial completion status

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 1000
          description: Task description
        completed:
          type: boolean
          description: Completion status

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details